services:

  # --- etcd cluster (3 nodes) ---
  etcd1:
    image: openeuler/etcd:3.6.4-oe2403sp1
    environment:
      - ETCD_NAME=etcd1
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd1:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd1:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_ENABLE_V2=true
    networks:
      pnet:
        ipv4_address: 172.18.0.2

  etcd2:
    image: openeuler/etcd:3.6.4-oe2403sp1
    environment:
      - ETCD_NAME=etcd2
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd2:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd2:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_ENABLE_V2=true
    networks:
      pnet:
        ipv4_address: 172.18.0.3

  etcd3:
    image: openeuler/etcd:3.6.4-oe2403sp1
    environment:
      - ETCD_NAME=etcd3
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd3:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd3:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_ENABLE_V2=true
    networks:
      pnet:
        ipv4_address: 172.18.0.4

  # --- Patroni / Postgres nodes ---
  patroni1:
    extra_hosts:
      - "etcd1:172.18.0.2"
      - "etcd2:172.18.0.3"
      - "etcd3:172.18.0.4"
    image: d2cio/patroni:latest
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni1.yml:/etc/patroni/patroni.yml:ro
      - ./data/patroni1:/var/lib/postgresql/data
      - ./wal-archive:/var/lib/postgresql/wal_archive
    environment:
      - PATRONI_NAME=pg1
      - PATRONI_ETCD_HOST=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
    networks: [pnet]
    ports:
      - "54321:5432"   # expose for testing (pg1)

  patroni2:
    extra_hosts:
      - "etcd1:172.18.0.2"
      - "etcd2:172.18.0.3"
      - "etcd3:172.18.0.4"
    image: d2cio/patroni:latest
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni2.yml:/etc/patroni/patroni.yml:ro
      - ./data/patroni2:/var/lib/postgresql/data
      - ./wal-archive:/var/lib/postgresql/wal_archive
    environment:
      - PATRONI_NAME=pg2
      - PATRONI_ETCD_HOST=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
    networks: [pnet]
    ports:
      - "54322:5432"

  patroni3:
    extra_hosts:
      - "etcd1:172.18.0.2"
      - "etcd2:172.18.0.3"
      - "etcd3:172.18.0.4"
    image: d2cio/patroni:latest
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni3.yml:/etc/patroni/patroni.yml:ro
      - ./data/patroni3:/var/lib/postgresql/data
      - ./wal-archive:/var/lib/postgresql/wal_archive
    environment:
      - PATRONI_NAME=pg3
      - PATRONI_ETCD_HOST=http://172.18.0.2:2379,http://172.18.0.3:2379,http://172.18.0.4:2379
    networks: [pnet]
    ports:
      - "54323:5432"

  # --- HAProxy for client connections ---
  haproxy:
    image: haproxy:latest
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [pnet]
    ports:
      - "5432:5432"

networks:
  pnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16