services:

  # --- etcd cluster (3 nodes) ---
  etcd1:
    image: openeuler/etcd:3.6.4-oe2403sp1
    container_name: etcd1-container
    environment:
      - ETCD_NAME=etcd1
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd1:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd1:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2380,etcd2=http://172.18.0.3:2380,etcd3=http://172.18.0.4:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    networks:
      pnet:
        ipv4_address: 172.18.0.2

  etcd2:
    image: openeuler/etcd:3.6.4-oe2403sp1
    container_name: etcd2-container
    environment:
      - ETCD_NAME=etcd2
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd2:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd2:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2380,etcd2=http://172.18.0.3:2380,etcd3=http://172.18.0.4:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    networks:
      pnet:
        ipv4_address: 172.18.0.3

  etcd3:
    image: openeuler/etcd:3.6.4-oe2403sp1
    container_name: etcd3-container
    environment:
      - ETCD_NAME=etcd3
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd3:2380
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd3:2379
      - ETCD_INITIAL_CLUSTER=etcd1=http://172.18.0.2:2380,etcd2=http://172.18.0.3:2380,etcd3=http://172.18.0.4:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    networks:
      pnet:
        ipv4_address: 172.18.0.4

  # --- Patroni / Postgres nodes ---
  patroni1:
    image: my-patroni-custom
    container_name: patroni1-container
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni1.yml:/etc/patroni/patroni.yml:ro
      - patroni1-data:/var/lib/postgresql/data:rw
      - patroni1-wal:/var/lib/postgresql/wal_archive:rw
    environment:
      - PATRONI_NAME=pg1
      - PATRONI_LOG=/var/lib/postgresql/data/patroni1/patroni.log
      # Variables SMTP depuis le fichier .env
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - FROM_EMAIL=${FROM_EMAIL}
      - TO_EMAIL=${TO_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    command: patroni /etc/patroni.yml
    networks:
      pnet:
        ipv4_address: 172.18.0.5
        aliases:
          - patroni1
    ports:
      - "5433:5432" # outside:inside

  patroni2:
    image: my-patroni-custom
    container_name: patroni2-container
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni2.yml:/etc/patroni/patroni.yml:ro
      - patroni2-data:/var/lib/postgresql/data:rw
      - patroni2-wal:/var/lib/postgresql/wal_archive:rw
    environment:
      - PATRONI_NAME=pg2
      - PATRONI_LOG=/var/lib/postgresql/data/patroni2/patroni.log
      # Variables SMTP depuis le fichier .env
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - FROM_EMAIL=${FROM_EMAIL}
      - TO_EMAIL=${TO_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    command: patroni /etc/patroni.yml
    networks:
      pnet:
        ipv4_address: 172.18.0.6
        aliases:
          - patroni2
    ports:
      - "5434:5432"

  patroni3:
    image: my-patroni-custom
    container_name: patroni3-container
    depends_on: [etcd1,etcd2,etcd3]
    volumes:
      - ./configs/patroni3.yml:/etc/patroni/patroni.yml:ro
      - patroni3-data:/var/lib/postgresql/data:rw
      - patroni3-wal:/var/lib/postgresql/wal_archive:rw
    environment:
      - PATRONI_NAME=pg3
      - PATRONI_LOG=/var/lib/postgresql/data/patroni3/patroni.log
      # Variables SMTP depuis le fichier .env
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - FROM_EMAIL=${FROM_EMAIL}
      - TO_EMAIL=${TO_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    command: patroni /etc/patroni.yml
    networks:
      pnet:
        ipv4_address: 172.18.0.7
        aliases:
          - patroni3
    ports:
      - "5435:5432" 

  # --- HAProxy for client connections ---
  haproxy:
    image: haproxy:latest
    container_name: haproxy-container
    depends_on: [patroni1,patroni2,patroni3]
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      pnet:
        ipv4_address: 172.18.0.8
    ports:
     - "5432:5435"
     - "5436:5436"
    # --- Pgpool-II : routage des lectures et écritures ---
  pgpool:
    build:
      context: .
      dockerfile: Dockerfile.pgpool

    container_name: pgpool-container

    depends_on:
      - patroni1
      - patroni2
      - patroni3

    volumes:
      - ./configs/pgpool.conf:/etc/pgpool2/pgpool.conf:ro
      - ./configs/pool_passwd:/etc/pgpool2/pool_passwd:ro

    ports:
      - "9999:9999"

    networks:
      pnet:
        ipv4_address: 172.18.0.9
        aliases:
          - pgpool

    restart: unless-stopped
    # --- PostgreSQL dédié à Odoo ---
  odoo-db:
    image: postgres:16
    container_name: odoo-db-container
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      pnet:
        ipv4_address: 172.18.0.10
        aliases:
          - odoo-db
    restart: unless-stopped

  # --- Odoo 18 ---
  odoo:
    image: odoo:18.0
    container_name: odoo-container
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
    networks:
      pnet:
        ipv4_address: 172.18.0.11
        aliases:
          - odoo
    restart: unless-stopped

networks:
  pnet:
    external: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/28
volumes:
  patroni1-data:
  patroni1-wal:
  patroni2-data:
  patroni2-wal:
  patroni3-data:
  patroni3-wal:
  odoo-db-data:
  odoo-web-data:
