version: '3.8'

services:
  # Node PostgreSQL 1 (Master potentiel)
  postgres1:
    build: 
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node1
    environment:
      - PATRONI_NAME=postgres1
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres1:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres1:5432
    volumes:
      - postgres_data1:/var/lib/postgresql/data
      - ./patroni/patroni1.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    networks:
      - postgres-cluster

  # Node PostgreSQL 2 (Standby)
  postgres2:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node2
    environment:
      - PATRONI_NAME=postgres2
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres2:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres2:5432
    volumes:
      - postgres_data2:/var/lib/postgresql/data
      - ./patroni/patroni2.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    networks:
      - postgres-cluster

  # Node PostgreSQL 3 (Standby)
  postgres3:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node3
    environment:
      - PATRONI_NAME=postgres3
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres3:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres3:5432
    volumes:
      - postgres_data3:/var/lib/postgresql/data
      - ./patroni/patroni3.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    networks:
      - postgres-cluster

  # HAProxy pour le load balancing
  haproxy:
    image: haproxy:2.8
    container_name: haproxy-lb
    ports:
      - "5432:5432"   # PostgreSQL
      - "7000:7000"   # Stats HAProxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - postgres-cluster
    depends_on:
      - postgres1
      - postgres2
      - postgres3

  # Etcd pour la coordination (requis par Patroni)
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd
    environment:
      - ETCDCTL_API=3
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
    command: >
      /usr/local/bin/etcd
      --data-dir /etcd-data
      --name etcd
      --initial-advertise-peer-urls http://etcd:2380
      --listen-peer-urls http://0.0.0.0:2380
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --initial-cluster-token etcd-cluster
      --initial-cluster etcd=http://etcd:2380
      --initial-cluster-state new
    networks:
      - postgres-cluster

volumes:
  postgres_data1:
  postgres_data2:
  postgres_data3:

networks:
  postgres-cluster:
    driver: bridge