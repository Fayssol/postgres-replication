services:
  consul:
    image: consul:1.15
    container_name: consul
    command: ["agent", "-dev", "-client=0.0.0.0"]
    networks:
      - postgres-cluster

  postgres1:
    build: 
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node1
    environment:
      - PATRONI_NAME=postgres1
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres1:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres1:5432
    volumes:
      - postgres_data1:/var/lib/postgresql/data
      - ./patroni/patroni1.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    ports:
      - "8008:8008"
    networks:
      - postgres-cluster
    depends_on:
      - consul

  postgres2:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node2
    environment:
      - PATRONI_NAME=postgres2
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres2:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres2:5432
    volumes:
      - postgres_data2:/var/lib/postgresql/data
      - ./patroni/patroni2.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    ports:
      - "8009:8008"
    networks:
      - postgres-cluster
    depends_on:
      - consul

  postgres3:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres-node3
    environment:
      - PATRONI_NAME=postgres3
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres3:8008
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres3:5432
    volumes:
      - postgres_data3:/var/lib/postgresql/data
      - ./patroni/patroni3.yml:/etc/patroni.yml
      - ./scripts/notify.sh:/scripts/notify.sh
    ports:
      - "8010:8008"
    networks:
      - postgres-cluster
    depends_on:
      - consul

  haproxy:
    image: haproxy:2.8
    container_name: haproxy-lb
    ports:
      - "5432:5432"
      - "7000:7000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - postgres-cluster
    depends_on:
      - postgres1
      - postgres2
      - postgres3

volumes:
  postgres_data1:
  postgres_data2:
  postgres_data3:

networks:
  postgres-cluster:
    driver: bridge