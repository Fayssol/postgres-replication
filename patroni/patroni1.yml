scope: postgres-cluster
name: postgres1

restapi:
  listen: 0.0.0.0:8008
  connect_address: postgres1:8008

consul:
  host: consul:8500

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10

  initdb:
  - encoding: UTF8

  pg_hba:
  - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: postgres1:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/16/bin
  
  authentication:
    replication:
      username: replicator
      password: replicator123
    superuser:
      username: postgres
      password: postgres123
tags:
  nofailover: false
  clonefrom: true      