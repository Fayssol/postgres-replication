global
    daemon
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen postgres
    bind *:5432
    mode tcp
    option httpchk OPTIONS /master
    
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 maxconn 100 check port 8008
    server postgres2 postgres2:5432 maxconn 100 check port 8008
    server postgres3 postgres3:5432 maxconn 100 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s