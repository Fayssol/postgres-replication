# ==================================================
# CONNEXIONS CLIENTS
# ==================================================

listen_addresses = '*'
port = 9999

socket_dir = '/var/run/postgresql'

# ==================================================
# MODE DE FONCTIONNEMENT
# ==================================================

backend_clustering_mode = 'streaming_replication'

load_balance_mode = on
statement_level_load_balance = on

# Conserver la cohérence après une écriture
disable_load_balance_on_write = 'transaction'

# ==================================================
# NŒUD 1 : PATRONI1
# ==================================================

backend_hostname0 = 'patroni1'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_application_name0 = 'pg1'

# ==================================================
# NŒUD 2 : PATRONI2
# ==================================================

backend_hostname1 = 'patroni2'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'ALLOW_TO_FAILOVER'
backend_application_name1 = 'pg2'

# ==================================================
# NŒUD 3 : PATRONI3
# ==================================================

backend_hostname2 = 'patroni3'
backend_port2 = 5432
backend_weight2 = 1
backend_flag2 = 'ALLOW_TO_FAILOVER'
backend_application_name2 = 'pg3'

# ==================================================
# SURVEILLANCE DES NŒUDS
# ==================================================

health_check_period = 10
health_check_timeout = 5
health_check_user = 'postgres'
health_check_password = 'postgres_password'
health_check_database = 'postgres'

# ==================================================
# VÉRIFICATION DE LA RÉPLICATION
# ==================================================

sr_check_period = 10
sr_check_user = 'postgres'
sr_check_password = 'postgres_password'

# ==================================================
# POOL DE CONNEXIONS
# ==================================================

num_init_children = 32
max_pool = 4

# ==================================================
# JOURNALISATION
# ==================================================

log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_statement = off

# Fichier contenant les mots de passe des utilisateurs PostgreSQL
pool_passwd = '/etc/pgpool2/pool_passwd'