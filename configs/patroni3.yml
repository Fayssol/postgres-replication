scope: mycluster
namespace: /service/
name: pg3

restapi:
  listen: 0.0.0.0:8010  # CHANGER le port
  connect_address: patroni3:8010

etcd3:
  hosts: "etcd1:2379,etcd2:2379,etcd3:2379"
  protocol: http

# SUPPRIMER TOUTE LA SECTION bootstrap

postgresql:
  callbacks:
    on_role_change: /etc/patroni/callbacks/on_role_change.sh
  listen: 0.0.0.0:5432
  connect_address: patroni3:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/14/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: repl_password
    superuser:
      username: postgres
      password: postgres_password
  parameters:
    unix_socket_directories: '/var/run/postgresql'