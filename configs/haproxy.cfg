global
    maxconn 2000
    tune.bufsize 8192

defaults
    mode tcp
    timeout connect 5s
    timeout client  1m
    timeout server  1m

frontend pg_front
    bind *:5432
    default_backend pg_back

backend pg_back
    mode tcp
    balance roundrobin
    option tcp-check
    # check Patroni REST to ensure server is primary/available is better (but tcp-check is minimal)
    server pg1 patroni1:5432 check
    server pg2 patroni2:5432 check
    server pg3 patroni3:5432 check

backend pg_primary
    mode tcp
    balance first
    option tcp-check
    server pg1 patroni1:5432 check
    server pg2 patroni2:5432 check backup
    server pg3 patroni3:5432 check backup