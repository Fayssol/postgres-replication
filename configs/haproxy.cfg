global
    daemon
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /



# Deux points d'entrée distincts :

# Pour les ecritures(INSERT, UPDATE, DELETE, CREATE, etc.) - leader
frontend pg_write
    bind *:5436  # 5436:5436
    default_backend pg_primary

# Pour les lectures(SELECT) - replicas
frontend pg_read
    bind *:5435 # 5432:5435
    default_backend pg_back  
    
# Nécessaire car HAProxy/Patroni ne peut pas distinguer les requêtes SQL.
# L'application peut gérer la charge et rediriger les lectures si le leader est saturé.
# Pour automatiser ce routage lecture/écriture, des outils comme PgPool-II peuvent être utilisés.

backend pg_back
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200

    server pg1 patroni1:5432 check port 8008
    server pg2 patroni2:5432 check port 8009
    server pg3 patroni3:5432 check port 8010


backend pg_primary
    mode tcp
    balance first
    option httpchk GET /leader
    http-check expect status 200

    server pg1 patroni1:5432 check port 8008
    server pg2 patroni2:5432 check port 8009
    server pg3 patroni3:5432 check port 8010
